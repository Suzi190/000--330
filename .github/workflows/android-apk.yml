name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 镜像自带的 Android SDK，避免第三方 action 固定下载链接失效
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK_ROOT" ] || SDK_ROOT=/usr/local/lib/android/sdk
          mkdir -p "$SDK_ROOT"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager 不在镜像里，改为手动下载 commandline-tools"
            got=""
            for url in \
              https://dl.google.com/android/repository/commandline-tools-linux-11076708_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip ; do
              if curl -fsSL -o /tmp/cmdline-tools.zip "$url"; then got="$url"; break; fi
            done
            [ -n "$got" ] || { echo "::error::下载 Android commandline-tools 失败"; exit 1; }
            rm -rf /tmp/cmdline-tools-unzip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unzip
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv /tmp/cmdline-tools-unzip/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMGR" --version || true
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK_ROOT/platforms"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 有签名 secrets 就用正式签名；没有则临时生成一个测试签名，保证 APK 可安装
      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/keystore
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/ephone-release.jks
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            ALIAS="${KEY_ALIAS:-ephone}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            keytool -genkeypair \
              -keystore android/keystore/ephone-release.jks \
              -storetype JKS \
              -alias ephone \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ephone123456 -keypass ephone123456 \
              -dname "CN=EPhone, OU=EPhone, O=EPhone, C=CN"
            STORE_PASSWORD=ephone123456
            ALIAS=ephone
            KEY_PASS=ephone123456
          fi
          {
            echo "storeFile=keystore/ephone-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
            echo "storeType=JKS"
          } > android/keystore/keystore.properties

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease -PbuildNumber=${GITHUB_RUN_NUMBER}

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::没有生成已签名的 app-release.apk（检查 keystore 配置）"
            find android/app/build/outputs -name '*.apk' -print
            exit 1
          fi
          cp "$APK" "dist/EPhone-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/EPhone.apk"
          ls -lh dist
          sha256sum dist/*.apk
          unzip -l dist/*.apk | grep -E 'assets/www/(index|script|style|native/ephone-native)' || true
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort | tail -n 1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs dist/*.apk | head -n 6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPhone-apk
          path: dist/*.apk
          retention-days: 30

      # 再发到 Release：手机上直接点链接就能下载安装（Artifact 需要登录才能下）
      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="自动构建 · 运行 #${GITHUB_RUN_NUMBER} · 提交 ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view apk-latest > /dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES" --latest
          else
            gh release create apk-latest --title "EPhone APK（自动构建）" --notes "$NOTES" --latest
          fi
          gh release upload apk-latest "dist/EPhone-${GITHUB_RUN_NUMBER}.apk" "dist/EPhone.apk" --clobber

